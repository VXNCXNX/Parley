[package]
name = "parley-native-runtime"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
transcribe-cpp = { version = "=0.2.3", default-features = false }
transcribe-cpp-sys = { version = "=0.2.3", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
transcribe-cpp = { version = "=0.2.3", default-features = false, features = ["metal"] }
transcribe-cpp-sys = { version = "=0.2.3", default-features = false, features = ["metal"] }

[target.'cfg(target_os = "linux")'.dependencies]
transcribe-cpp = { version = "=0.2.3", default-features = false, features = ["dynamic-backends", "vulkan"] }
transcribe-cpp-sys = { version = "=0.2.3", default-features = false, features = ["dynamic-backends", "vulkan"] }

[target.'cfg(all(windows, target_arch = "x86_64"))'.dependencies]
transcribe-cpp = { version = "=0.2.3", default-features = false, features = ["dynamic-backends", "vulkan"] }
transcribe-cpp-sys = { version = "=0.2.3", default-features = false, features = ["dynamic-backends", "vulkan"] }

[target.'cfg(all(windows, target_arch = "aarch64"))'.dependencies]
transcribe-cpp = { version = "=0.2.3", default-features = false }
transcribe-cpp-sys = { version = "=0.2.3", default-features = false }
