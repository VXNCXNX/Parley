name: "Release"

on:
  workflow_dispatch:
    inputs:
      sign-binaries:
        description: "Use Developer ID signing and notarization secrets"
        type: boolean
        default: false

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  prepare-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release-id: ${{ steps.prepare.outputs.release-id }}
      version: ${{ steps.prepare.outputs.version }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Create or reuse draft release
        id: prepare
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const { version } = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
            const entries = fs.readFileSync('CHANGELOG.md', 'utf8')
              .split(/^## /m)
              .filter(entry => entry.startsWith(`[${version}] - `));
            if (entries.length !== 1) {
              throw new Error(`Expected one CHANGELOG.md entry for ${version}`);
            }
            const body = entries[0].slice(entries[0].indexOf('\n') + 1).trim();
            if (!body) throw new Error(`Empty changelog entry for ${version}`);

            const repo = context.repo;
            const tag = `v${version}`;
            const releases = await github.paginate(github.rest.repos.listReleases, repo);
            const existing = releases.find(release => release.tag_name === tag);
            if (existing && !existing.draft) {
              throw new Error(`${tag} is already published`);
            }

            let tagRef;
            try {
              tagRef = (await github.rest.git.getRef({ ...repo, ref: `tags/${tag}` })).data;
            } catch (error) {
              if (error.status !== 404) throw error;
              tagRef = (await github.rest.git.createRef({
                ...repo, ref: `refs/tags/${tag}`, sha: context.sha,
              })).data;
            }
            let object = tagRef.object;
            while (object.type === 'tag') {
              object = (await github.rest.git.getTag({ ...repo, tag_sha: object.sha })).data.object;
            }
            if (object.type !== 'commit' || object.sha !== context.sha) {
              throw new Error(`${tag} does not point to release commit ${context.sha}`);
            }

            const release = {
              ...repo,
              tag_name: tag,
              target_commitish: context.sha,
              name: tag,
              body,
              draft: true,
              prerelease: false,
            };
            const { data } = existing
              ? await github.rest.repos.updateRelease({ ...release, release_id: existing.id })
              : await github.rest.repos.createRelease(release);
            core.setOutput('release-id', String(data.id));
            core.setOutput('version', version);

  build-macos:
    permissions:
      contents: write
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-26"
            target: "aarch64-apple-darwin"
          - platform: "macos-15-intel"
            target: "x86_64-apple-darwin"
    uses: ./.github/workflows/build.yml
    with:
      platform: ${{ matrix.platform }}
      target: ${{ matrix.target }}
      ref: ${{ github.sha }}
      build-args: >-
        --target ${{ matrix.target }} --bundles app,dmg
        ${{ !inputs.sign-binaries && '--config src-tauri/tauri.release-adhoc.conf.json' || '' }}
      sign-binaries: ${{ inputs.sign-binaries }}
      upload-artifacts: true
      release-id: ${{ needs.prepare-release.outputs.release-id }}
    secrets: inherit

  build-linux:
    permissions:
      contents: write
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "ubuntu-22.04"
            target: "x86_64-unknown-linux-gnu"
          - platform: "ubuntu-24.04-arm"
            target: "aarch64-unknown-linux-gnu"
    uses: ./.github/workflows/build.yml
    with:
      platform: ${{ matrix.platform }}
      target: ${{ matrix.target }}
      ref: ${{ github.sha }}
      build-args: "--bundles appimage,deb,rpm"
      sign-binaries: false
      upload-artifacts: true
      release-id: ${{ needs.prepare-release.outputs.release-id }}
    secrets: inherit

  # Windows is unsigned until a signer exists. The sign-binaries input only covers the Apple
  # secrets, so it is not forwarded here. See the Windows signing note in build.yml.
  build-windows:
    permissions:
      contents: write
    needs: prepare-release
    uses: ./.github/workflows/build.yml
    with:
      platform: "windows-latest"
      target: "x86_64-pc-windows-msvc"
      ref: ${{ github.sha }}
      build-args: "--bundles nsis"
      sign-binaries: false
      upload-artifacts: true
      release-id: ${{ needs.prepare-release.outputs.release-id }}
    secrets: inherit

  verify-downloads:
    permissions:
      contents: read
    needs: [prepare-release, build-macos, build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Check draft downloads
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.prepare-release.outputs.release-id }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
        with:
          github-token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const repo = context.repo;
            const release_id = Number(process.env.RELEASE_ID);
            const version = process.env.VERSION;
            const { data: release } = await github.rest.repos.getRelease({ ...repo, release_id });
            const { data: commit } = await github.rest.repos.getCommit({
              ...repo, ref: `refs/tags/v${version}`,
            });
            if (!release.draft || release.tag_name !== `v${version}` || commit.sha !== context.sha) {
              throw new Error('Release is not a draft for this exact commit');
            }
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, { ...repo, release_id });
            const required = [
              `Parley_${version}_aarch64.dmg`,
              `Parley_${version}_x64.dmg`,
              'Parley_aarch64.app.tar.gz',
              'Parley_x64.app.tar.gz',
              `Parley_${version}_amd64.AppImage`,
              `Parley_${version}_aarch64.AppImage`,
              `Parley_${version}_amd64.deb`,
              `Parley_${version}_arm64.deb`,
              `Parley-${version}-1.x86_64.rpm`,
              `Parley-${version}-1.aarch64.rpm`,
              `Parley_${version}_x64-setup.exe`,
            ];
            for (const name of required) {
              if (!assets.some(asset => asset.name === name && asset.state === 'uploaded' && asset.size > 0)) {
                throw new Error(`Missing release download: ${name}`);
              }
            }
